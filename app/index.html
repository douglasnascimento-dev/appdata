<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel Municipal</title>
  <meta name="description" content="Indicadores socioeconômicos do município: população, PIB, emprego, empresas e produção agropecuária.">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="36" height="36">
        <div>
          <strong>Painel Municipal</strong>
          <span>Dados que orientam decisões</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="btn-install" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
          Instalar app
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="place">
          <p class="eyebrow" id="place-region">—</p>
          <h1 id="place-name">Carregando…</h1>
          <div class="chips" id="place-chips"></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-share" title="Compartilhar" aria-label="Compartilhar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
          </button>
          <button class="icon-btn" id="btn-theme" title="Alternar tema" aria-label="Alternar tema claro/escuro">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>
        </div>
      </header>

      <div class="banner" id="sample-banner" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <p><strong>Dados fictícios de demonstração.</strong> Gere os dados reais com
          <code>python etl/coletar_dados.py --municipio &lt;código IBGE&gt;</code></p>
      </div>

      <section id="view" class="view" aria-live="polite"></section>

      <footer class="foot">
        <p>Fontes: IBGE (SIDRA), Ministério do Trabalho (RAIS e Novo CAGED). <span id="generated"></span></p>
      </footer>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navegação"></nav>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/format.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
